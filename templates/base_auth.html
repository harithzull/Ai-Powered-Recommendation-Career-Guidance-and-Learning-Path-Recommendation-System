<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}CareerCoach FYP{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root {
      --ink: #15201c; --paper: #f3efe6; --paper-2: #ece6d8; --line: #d8cfbd;
      --moss: #2f5e4e; --moss-deep: #1e3f34; --clay: #c25a3a; --gold: #c79a3a;
      --muted: #6b6456; --r: 14px;
      --shadow: 0 1px 2px rgba(30,30,20,.05), 0 12px 30px -16px rgba(30,40,30,.25);
      --display: "Inter", system-ui, sans-serif;
      --body: "Inter", system-ui, sans-serif;
      --mono: "Inter", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--paper); color: var(--ink); font-family: var(--body);
      -webkit-font-smoothing: antialiased; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px;
    }
    ::selection { background: var(--moss); color: var(--paper); }
    a { color: var(--moss); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .auth-brand {
      display: flex; align-items: center; gap: 10px; margin-bottom: 32px;
    }
    .auth-brand svg { width: 32px; height: 32px; }
    .auth-brand span { font-family: var(--display); font-size: 22px; font-weight: 600; color: var(--moss-deep); }
    .auth-brand small { font-family: var(--mono); font-size: 9px; letter-spacing: .2em; color: var(--muted); display: block; margin-top: 1px; }

    .auth-card {
      background: #fff; border: 1px solid var(--line); border-radius: 18px;
      padding: 36px 40px; width: 100%; max-width: 420px;
      box-shadow: var(--shadow);
    }
    .auth-card h2 {
      font-family: var(--display); font-size: 24px; font-weight: 600;
      letter-spacing: -.01em; margin-bottom: 6px; color: var(--ink);
    }
    .auth-card .sub { font-size: 14px; color: var(--muted); margin-bottom: 28px; }

    .f-group { margin-bottom: 18px; }
    .f-label { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
    .f-input {
      width: 100%; padding: 10px 13px; border: 1.5px solid var(--line);
      border-radius: 10px; font-size: 14px; font-family: var(--body);
      background: var(--paper); color: var(--ink); outline: none; transition: border-color .15s;
    }
    .f-input:focus { border-color: var(--moss); background: #fff; }
    .f-input.err { border-color: var(--clay); }
    .f-error { font-size: 12px; color: var(--clay); margin-top: 5px; }

    .auth-btn {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      background: var(--moss); color: #fff; font-size: 15px; font-weight: 600;
      font-family: var(--body); cursor: pointer; transition: .16s; margin-top: 8px;
    }
    .auth-btn:hover { background: var(--moss-deep); transform: translateY(-1px); }

    .auth-foot { text-align: center; font-size: 13.5px; color: var(--muted); margin-top: 20px; }
    .auth-foot a { color: var(--moss); font-weight: 600; }

    .a-alert-auth {
      padding: 11px 14px; border-radius: 10px; font-size: 13px;
      display: flex; align-items: center; gap: 10px; margin-bottom: 18px;
      background: #fdf0ed; border: 1px solid #e8a89c; color: #7a2a1a;
    }
  </style>
</head>
<body>

<div class="auth-brand">
  <svg viewBox="0 0 40 40" fill="none">
    <circle cx="20" cy="20" r="18" stroke="#c79a3a" stroke-width="1.4" opacity=".6"/>
    <circle cx="20" cy="20" r="4.5" fill="#c79a3a"/>
    <circle cx="29" cy="13" r="2.4" fill="#2f5e4e"/>
    <path d="M20 20 L29 13 M20 20 L13 27" stroke="#2f5e4e" stroke-width="1.2" opacity=".7"/>
  </svg>
  <div>
    <span>FYP</span>
    <small>CAREER&nbsp;COACH</small>
  </div>
</div>

<div class="auth-card">
  {% block content %}{% endblock %}
</div>

<div class="auth-foot" style="margin-top:20px">
  {% block auth_foot %}{% endblock %}
</div>

</body>
</html>
