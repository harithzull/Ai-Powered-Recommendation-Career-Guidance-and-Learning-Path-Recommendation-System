name: Security and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --no-deps --disable-pip -r requirements.lock
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    env:
      DJANGO_SETTINGS_MODULE: careercoach.test_settings
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install CPU-only ML runtime and locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Check models and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py audit_career_data --fail-on-errors
      - name: Run offline tests
        run: python manage.py test --verbosity 2
      - name: Compare synthetic recommendation rankings without network access
        run: python scripts/evaluate_recommendations.py --output .cache/phase2c-comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: recommendation-evaluation-python-${{ matrix.python-version }}
          path: .cache/phase2c-comparison.json
      - name: Check the published assessment bank in an isolated in-memory database
        run: python manage.py shell -c "from django.core.management import call_command; call_command('migrate', verbosity=0); call_command('check_assessment_bank')"
      - name: Check production settings
        run: python scripts/check_deploy.py
